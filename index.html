<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surf - 冲浪小游戏</title>
<style>
  :root {
    --accent: #ffd34d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0b1f3a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.78));
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    background: #58b7e8;
  }

  canvas { display: block; width: 100%; height: 100%; }

  /* 移动端按键 */
  #touch {
    position: absolute;
    inset: 0;
    display: none;
    pointer-events: none;
  }
  #touch button {
    position: absolute;
    pointer-events: auto;
    border: 0;
    background: rgba(255,255,255,.16);
    color: #fff;
    font-size: 26px;
    border-radius: 50%;
    width: 64px;
    height: 64px;
    backdrop-filter: blur(4px);
    border: 1px solid rgba(255,255,255,.3);
    touch-action: manipulation;
  }
  #touch button:active { background: rgba(255,255,255,.35); }
  #btn-up   { left: 14px; bottom: 120px; }
  #btn-down { left: 14px; bottom: 34px; }
  #btn-left { right: 120px; bottom: 34px; }
  #btn-right{ right: 34px; bottom: 34px; }

  @media (pointer: coarse) {
    #touch { display: block; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="touch">
      <button id="btn-up" aria-label="上">▲</button>
      <button id="btn-down" aria-label="下">▼</button>
      <button id="btn-left" aria-label="左">◀</button>
      <button id="btn-right" aria-label="右">▶</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ---------- 基础设置 ----------
  const W = 960, H = 540;
  const LANE_Y = [210, 315, 420];           // 上 / 中 / 下 三条泳道
  const PLAYER_BASE_X = 150;
  const MIN_X = 70, MAX_X = 430;

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = W; canvas.height = H;

  // ---------- 音效（WebAudio 无素材） ----------
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.12) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfxPick = () => beep(880, .12, "sine");
  const sfxCrash = () => { beep(180, .3, "sawtooth", .15); beep(90, .4, "sawtooth", .15); };
  const sfxLane = () => beep(520, .06, "triangle", .08);

  // ---------- 游戏状态 ----------
  const state = {
    mode: "menu",          // menu | playing | over
    score: 0,
    best: Number(localStorage.getItem("surf-best") || 0),
    speed: 260,
    distance: 0,
    lane: 1,
    px: PLAYER_BASE_X,
    py: LANE_Y[1],
    t: 0,
    shake: 0,
    obstacles: [],
    pickups: [],
    particles: [],
    spawnTimer: 0,
    spawnGap: 1.35,
    showHint: false,
  };

  function reset() {
    state.score = 0;
    state.speed = 260;
    state.distance = 0;
    state.lane = 1;
    state.px = PLAYER_BASE_X;
    state.py = LANE_Y[1];
    state.t = 0;
    state.shake = 0;
    state.obstacles = [];
    state.pickups = [];
    state.particles = [];
    state.spawnTimer = 1.0;
    state.spawnGap = 1.35;
  }

  // ---------- 输入 ----------
  function moveLane(d) {
    if (state.mode !== "playing") return;
    const nl = Math.max(0, Math.min(2, state.lane + d));
    if (nl !== state.lane) { state.lane = nl; sfxLane(); }
  }
  function moveX(dx) {
    if (state.mode !== "playing") return;
    state.px = Math.max(MIN_X, Math.min(MAX_X, state.px + dx));
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k.toLowerCase()) || e.key === " ") {
      e.preventDefault();
    }
    if (k === "arrowup" || k === "w") moveLane(-1);
    else if (k === "arrowdown" || k === "s") moveLane(1);
    else if (k === "arrowleft" || k === "a") moveX(-16);
    else if (k === "arrowright" || k === "d") moveX(16);
    else if (e.key === " " || e.key === "Enter") {
      if (state.mode === "menu") startGame();
      else if (state.mode === "over") startGame();
    }
  });

  // 触屏按钮
  const bind = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    const fire = (e) => { e.preventDefault(); fn(); };
    el.addEventListener("pointerdown", fire);
  };
  bind("btn-up", () => moveLane(-1));
  bind("btn-down", () => moveLane(1));
  bind("btn-left", () => moveX(-16));
  bind("btn-right", () => moveX(16));

  // 点击/触摸画布也可切换（点上半=上，下半=下，仅作为辅助）
  canvas.addEventListener("pointerdown", (e) => {
    if (state.mode === "menu" || state.mode === "over") { startGame(); return; }
    const rect = canvas.getBoundingClientRect();
    const y = (e.clientY - rect.top) / rect.height * H;
    if (y < LANE_Y[1]) moveLane(-1);
    else moveLane(1);
  });

  function startGame() {
    reset();
    state.mode = "playing";
    try { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {}
  }

  // ---------- 生成 ----------
  function spawnObstacle() {
    const lane = Math.floor(Math.random() * 3);
    const kind = ["bird", "palm", "kraken"][lane]; // 上=海鸥 中=棕榈岛 下=海怪
    state.obstacles.push({
      kind,
      lane,
      x: W + 60,
      w: kind === "bird" ? 62 : kind === "palm" ? 78 : 86,
      h: kind === "bird" ? 44 : kind === "palm" ? 96 : 120,
    });
  }

  function spawnPickup() {
    const lane = Math.floor(Math.random() * 3);
    state.pickups.push({ lane, x: W + 30, r: 16 });
  }

  // ---------- 更新 ----------
  function update(dt) {
    if (state.mode !== "playing") return;

    state.t += dt;
    state.speed = Math.min(760, 260 + state.t * 7);
    state.distance += state.speed * dt;
    state.score = Math.floor(state.distance / 12);
    state.py += (LANE_Y[state.lane] - state.py) * Math.min(1, dt * 12);
    state.spawnGap = Math.max(0.72, 1.35 - state.t * 0.012);

    // 生成障碍
    state.spawnTimer -= dt;
    if (state.spawnTimer <= 0) {
      state.spawnTimer = state.spawnGap * (0.8 + Math.random() * 0.5);
      if (Math.random() < 0.8) spawnObstacle();
      if (Math.random() < 0.35) spawnPickup();
    }

    // 障碍移动 + 碰撞
    const px = state.px, py = state.py;
    const pw = 52, ph = 34; // 玩家碰撞盒
    for (let i = state.obstacles.length - 1; i >= 0; i--) {
      const o = state.obstacles[i];
      o.x -= state.speed * dt;
      if (o.x < -120) { state.obstacles.splice(i, 1); continue; }
      const oy = LANE_Y[o.lane] - o.h / 2;
      // 碰撞（略缩小，更宽容）
      if (rectHit(px - pw/2, py - ph/2, pw, ph, o.x - o.w/2 + 6, oy + 6, o.w - 12, o.h - 12)) {
        gameOver();
        return;
      }
    }

    // 拾取物
    for (let i = state.pickups.length - 1; i >= 0; i--) {
      const p = state.pickups[i];
      p.x -= state.speed * dt;
      if (p.x < -40) { state.pickups.splice(i, 1); continue; }
      const py2 = LANE_Y[p.lane];
      const dx = px - p.x, dy = py - py2;
      if (dx * dx + dy * dy < (34 + p.r) * (34 + p.r)) {
        state.score += 50;
        sfxPick();
        burst(p.x, py2, "#ffe082", 10);
        state.pickups.splice(i, 1);
      }
    }

    // 粒子
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const pt = state.particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) state.particles.splice(i, 1);
    }

    if (state.shake > 0) state.shake -= dt * 30;
  }

  function rectHit(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 60 + Math.random() * 140;
      state.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life: 0.4 + Math.random() * 0.4,
        color,
      });
    }
  }

  function gameOver() {
    state.mode = "over";
    sfxCrash();
    state.shake = 14;
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem("surf-best", String(state.best));
    }
  }

  // ---------- 绘制 ----------
  function draw() {
    ctx.save();
    if (state.shake > 0) {
      ctx.translate((Math.random() - .5) * state.shake, (Math.random() - .5) * state.shake);
    }

    drawSky();
    drawOcean();
    drawEntities();
    drawHUD();

    ctx.restore();

    if (state.mode === "menu") drawMenu();
    else if (state.mode === "over") drawGameOver();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#4fc3f7");
    g.addColorStop(0.55, "#8fd8f7");
    g.addColorStop(0.75, "#ffe9b8");
    g.addColorStop(1, "#ffd9a0");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 太阳
    const sunX = 780, sunY = 120;
    const glow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 120);
    glow.addColorStop(0, "rgba(255,244,180,.95)");
    glow.addColorStop(0.4, "rgba(255,214,110,.55)");
    glow.addColorStop(1, "rgba(255,214,110,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(sunX - 130, sunY - 130, 260, 260);
    ctx.fillStyle = "#fff3c4";
    ctx.beginPath(); ctx.arc(sunX, sunY, 42, 0, Math.PI * 2); ctx.fill();

    // 云
    drawCloud(120 + Math.sin(state.t * 0.08) * 20, 80, 1.0);
    drawCloud(420 + Math.sin(state.t * 0.06 + 2) * 26, 130, 0.8);
    drawCloud(700 + Math.sin(state.t * 0.05 + 4) * 30, 60, 0.9);
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.beginPath();
    ctx.arc(x, y, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y - 8 * s, 24 * s, 0, Math.PI * 2);
    ctx.arc(x + 46 * s, y, 18 * s, 0, Math.PI * 2);
    ctx.arc(x + 22 * s, y + 6 * s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function waveY(x) {
    const base = 345;
    return base + Math.sin(x * 0.012 + state.t * 2.4) * 9 + Math.sin(x * 0.027 + state.t * 1.6) * 5;
  }

  function drawOcean() {
    // 海水
    const g = ctx.createLinearGradient(0, 300, 0, H);
    g.addColorStop(0, "#2fa7d6");
    g.addColorStop(0.5, "#1a7fb8");
    g.addColorStop(1, "#0d5a8e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 300, W, H - 300);

    // 浪花
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#eafaff";
    ctx.beginPath();
    ctx.moveTo(-10, waveY(-10));
    for (let x = -10; x <= W + 10; x += 6) {
      ctx.lineTo(x, waveY(x));
    }
    ctx.stroke();

    // 浪花泡沫
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-10, waveY(-10) + 10);
    for (let x = -10; x <= W + 10; x += 8) {
      ctx.lineTo(x, waveY(x) + 10);
    }
    ctx.stroke();

    // 水中光斑
    ctx.fillStyle = "rgba(255,255,255,.07)";
    for (let i = 0; i < 6; i++) {
      const x = ((i * 173 + state.t * 40) % (W + 200)) - 100;
      const y = 360 + (i * 37) % 150;
      ctx.beginPath();
      ctx.ellipse(x, y, 40, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawEntities() {
    // 拾取物（贝壳）
    for (const p of state.pickups) {
      drawShell(p.x, LANE_Y[p.lane], p.r);
    }
    // 障碍
    for (const o of state.obstacles) {
      const y = LANE_Y[o.lane];
      if (o.kind === "bird") drawBird(o.x, y);
      else if (o.kind === "palm") drawPalm(o.x, y);
      else drawKraken(o.x, y);
    }
    // 玩家
    drawSurfer(state.px, state.py);
    // 粒子
    for (const pt of state.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / 0.5);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawSurfer(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 滑板
    ctx.save();
    ctx.rotate(-0.10);
    ctx.fillStyle = "#ff7043";
    roundRect(-32, 0, 64, 14, 7);
    ctx.fill();
    ctx.fillStyle = "#ffb74d";
    roundRect(-26, 2, 52, 4, 2);
    ctx.fill();
    ctx.restore();

    // 人物
    ctx.fillStyle = "#ffd54f"; // 身体
    ctx.beginPath();
    ctx.arc(2, -24, 9, 0, Math.PI * 2);
    ctx.fill();
    // 帽子
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(2, -30, 8, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = "#ef5350";
    ctx.beginPath();
    ctx.arc(2, -30, 4, 0, Math.PI * 2);
    ctx.fill();
    // 身体
    ctx.fillStyle = "#26a69a";
    ctx.beginPath();
    roundRect(-6, -16, 16, 18, 6);
    ctx.fill();
    // 手臂
    ctx.strokeStyle = "#ffcc80";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-6, -12); ctx.lineTo(-18, -4);
    ctx.moveTo(10, -12); ctx.lineTo(22, -2);
    ctx.stroke();

    ctx.restore();
  }

  function drawBird(x, y) {
    ctx.save();
    ctx.translate(x, y);
    const flap = Math.sin(state.t * 10 + x) * 8;
    ctx.strokeStyle = "#37474f";
    ctx.lineWidth = 4;
    ctx.lineCap = "round";
    // 翅膀
    ctx.beginPath();
    ctx.moveTo(-18, 0); ctx.quadraticCurveTo(-6, -10 - flap, 4, 0);
    ctx.moveTo(4, 0); ctx.quadraticCurveTo(14, -10 + flap, 22, 0);
    ctx.stroke();
    // 身体
    ctx.fillStyle = "#546e7a";
    ctx.beginPath();
    ctx.ellipse(2, -2, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawPalm(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // 沙洲
    ctx.fillStyle = "#f3d689";
    ctx.beginPath();
    ctx.ellipse(0, 40, 40, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    // 树干
    ctx.strokeStyle = "#8d6e63";
    ctx.lineWidth = 8;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, 40);
    ctx.quadraticCurveTo(6, 0, -2, -30);
    ctx.stroke();
    // 叶子
    ctx.fillStyle = "#43a047";
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.55;
      ctx.save();
      ctx.translate(-2, -30);
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(0, -16, 9, 20, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawKraken(x, y) {
    ctx.save();
    ctx.translate(x, y);
    const sway = Math.sin(state.t * 4 + x) * 6;
    ctx.strokeStyle = "#7e57c2";
    ctx.lineWidth = 13;
    ctx.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const off = (i - 1) * 22;
      ctx.beginPath();
      ctx.moveTo(off, 60);
      ctx.quadraticCurveTo(off + sway, 10, off + sway * 1.4, -38);
      ctx.stroke();
      // 吸盘
      ctx.fillStyle = "#b39ddb";
      ctx.beginPath();
      ctx.arc(off + sway * 1.4, -38, 8, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawShell(x, y, r) {
    ctx.save();
    ctx.translate(x, y);
    const pulse = 1 + Math.sin(state.t * 6) * 0.08;
    ctx.scale(pulse, pulse);
    ctx.fillStyle = "#ffca80";
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#e8964b";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(0, 0, r - 4, 0, Math.PI * 2);
    ctx.stroke();
    // 高光
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.beginPath();
    ctx.arc(-r * 0.35, -r * 0.35, r * 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = "#fff";
    ctx.font = "bold 26px 'Segoe UI', system-ui, sans-serif";
    ctx.textBaseline = "top";
    ctx.fillText(String(state.score).padStart(5, "0"), 20, 16);
    ctx.font = "13px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("得分", 20, 46);

    ctx.textAlign = "right";
    ctx.font = "bold 20px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("最佳 " + String(state.best).padStart(5, "0"), W - 20, 18);
    ctx.textAlign = "left";

    // 速度
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.font = "bold 13px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("速度 " + Math.round(state.speed / 260 * 100) + "%", 20, H - 20);
  }

  function drawMenu() {
    overlay("rgba(10, 30, 60, .45)");
    ctx.fillStyle = "#fff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "900 84px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("SURF", W / 2, 170);

    ctx.font = "26px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#ffe082";
    ctx.fillText("复刻 Edge 冲浪小游戏", W / 2, 230);

    ctx.font = "18px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("↑ / ↓  切换泳道      ← / →  左右移动", W / 2, 320);
    ctx.fillText("空格键 开始游戏", W / 2, 355);

    const pulse = 0.85 + Math.sin(state.t * 4) * 0.15;
    ctx.font = "bold 26px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255," + pulse.toFixed(2) + ")";
    ctx.fillText("点击 或 按空格 开始", W / 2, 420);

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  function drawGameOver() {
    overlay("rgba(10, 20, 40, .55)");
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.font = "900 64px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#ff8a80";
    ctx.fillText("游戏结束", W / 2, 180);

    ctx.font = "30px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("得分  " + String(state.score).padStart(5, "0"), W / 2, 250);

    ctx.font = "20px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#ffe082";
    const newBest = state.score >= state.best && state.score > 0;
    ctx.fillText(newBest ? "🎉 新纪录！" : "最佳  " + String(state.best).padStart(5, "0"), W / 2, 300);

    ctx.font = "18px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText("按 空格 或 点击屏幕 再来一局", W / 2, 380);

    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  function overlay(color) {
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, W, H);
  }

  function roundRect(x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
  }

  // ---------- 主循环 ----------
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 预载：菜单画面需要 t 动起来
  setInterval(() => { if (state.mode !== "playing") state.t += 0.05; }, 50);
})();
</script>
