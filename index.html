<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Surf · 冲浪小游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #062a4a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 6px; }
  #stage {
    position: relative; width: min(100vw, calc(100vh * 1.78)); aspect-ratio: 16 / 9;
    border-radius: 12px; overflow: hidden; background: #4fc3f7;
    box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
  }
  canvas { display: block; width: 100%; height: 100%; }
  #touch { position: absolute; inset: 0; display: none; pointer-events: none; }
  #touch button {
    position: absolute; pointer-events: auto; border: 0; background: rgba(255,255,255,.15);
    color: #fff; font-size: 24px; border-radius: 50%; width: 62px; height: 62px;
    border: 1px solid rgba(255,255,255,.3); touch-action: manipulation;
  }
  #touch button:active { background: rgba(255,255,255,.38); }
  #btn-up    { left: 12px; bottom: 128px; }
  #btn-down  { left: 12px; bottom: 40px; }
  #btn-left  { right: 132px; bottom: 40px; }
  #btn-right { right: 40px; bottom: 40px; }
  #btn-boost { right: 40px; bottom: 128px; background: rgba(255,210,60,.25); font-size: 15px; font-weight: bold; }
  @media (pointer: coarse) { #touch { display: block; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="touch">
      <button id="btn-up">▲</button>
      <button id="btn-down">▼</button>
      <button id="btn-left">◀</button>
      <button id="btn-right">▶</button>
      <button id="btn-boost">⚡</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ============ 基础 ============
  const W = 960, H = 540;
  const WAVE_Y = 330;           // 浪面基准线（冲浪者骑在浪上）
  const SURF_X = 200;           // 冲浪者屏幕 X
  const MIN_X = 88, MAX_X = 430;
  const MAX_UP = WAVE_Y - 150;  // 最高跳跃
  const MAX_DOWN = WAVE_Y + 150;// 最深下潜

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = W; canvas.height = H;

  // ============ 音效 ============
  let audioCtx = null;
  function beep(freq, dur, type = "sine", vol = 0.12) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    jump:   () => beep(500, .12, "triangle", .08),
    dive:   () => beep(300, .14, "sine", .1),
    pickup: () => { beep(880, .1, "sine"); setTimeout(() => beep(1320, .12, "sine"), 60); },
    crash:  () => { beep(160, .3, "sawtooth", .14); beep(80, .4, "sawtooth", .14); },
    boost:  () => beep(200, .5, "sawtooth", .1),
    ramp:   () => { beep(400, .12, "triangle"); setTimeout(() => beep(800, .16, "triangle"), 80); },
    kraken: () => { beep(70, .7, "sawtooth", .18); beep(55, .8, "sawtooth", .16); },
  };

  // ============ 状态 ============
  const S = {
    mode: "menu",            // menu | play | over
    score: 0,
    dist: 0,                 // 距离累计（浮点）
    best: +(localStorage.getItem("surf2-best") || 0),
    time: 0,
    t: 0,                    // 全局动画时间
    // 前进速度（世界滚动）
    fwd: 0, fwdMax: 460, fwdMin: 170,
    // 冲浪者
    x: SURF_X, y: WAVE_Y, vy: 0, vx: 0,
    jumpHeld: false, diveHeld: false,
    // 生命 / 加速 / 朋友
    lives: 3, boosts: 0, boostMax: 3,
    boosting: 0,              // 加速剩余秒
    shield: 0,                // 无敌剩余秒
    air: 0,                   // 腾空剩余秒（坡道）
    friend: false,
    // 海怪
    kraken: 0,                // 触手事件剩余秒
    krakenWarn: 0,
    // 减速
    slow: 0,
    // 实体
    obstacles: [], pickups: [], fx: [], tentacles: [],
    spawnT: 0, pickupT: 2, friendSpawned: false,
    hint: 0,
    shake: 0,
    over: null,               // 'lives' | 'kraken'
  };

  // ============ 障碍定义 ============
  // kind: 'jump' 需要跳过（在上方） | 'dive' 需要下潜（在下方）
  const OBS = {
    rock:   { w: 76, h: 50, y: WAVE_Y - 16, kind: "jump", wgt: 30 },
    kelp:   { w: 54, h: 168, y: WAVE_Y - 54, kind: "jump", wgt: 18 },
    island: { w: 98, h: 150, y: WAVE_Y - 88, kind: "jump", wgt: 9 },
    crate:  { w: 64, h: 44, y: WAVE_Y - 38, kind: "dive", wgt: 22 },
    boat:   { w: 150, h: 66, y: WAVE_Y - 52, kind: "dive", wgt: 13 },
    buoy:   { w: 38, h: 42, y: WAVE_Y - 14, kind: "slow", wgt: 18 },
    ramp:   { w: 92, h: 28, y: WAVE_Y - 4,  kind: "ramp", wgt: 6 },
  };

  function reset() {
    S.mode = "play"; S.score = 0; S.dist = 0; S.time = 0;
    S.fwd = S.fwdMin;
    S.x = SURF_X; S.y = WAVE_Y; S.vy = 0; S.vx = 0;
    S.lives = 3; S.boosts = 0; S.boosting = 0; S.shield = 0; S.air = 0;
    S.friend = false; S.kraken = 0; S.krakenWarn = 0; S.slow = 0;
    S.obstacles = []; S.pickups = []; S.fx = []; S.tentacles = [];
    S.spawnT = 1.2; S.pickupT = 2.2; S.friendSpawned = false;
    S.hint = 3; S.shake = 0; S.over = null;
  }

  // ============ 输入 ============
  function actJump() {
    if (S.mode !== "play") return;
    if (S.air > 0) return;                       // 空中只能下潜
    S.vy = -760; S.jumpHeld = true; sfx.jump();
  }
  function actDive() {
    if (S.mode !== "play") return;
    S.vy = Math.min(S.vy + 500, 860); S.diveHeld = true; sfx.dive();
  }
  function actLeft() { if (S.mode === "play") S.vx = -330; }
  function actRight() { if (S.mode === "play") S.vx = 330; }
  function actBoost() {
    if (S.mode !== "play") return;
    if (S.boosts > 0 && S.boosting <= 0) {
      S.boosts--; S.boosting = 3.0; sfx.boost();
      burst(S.x, S.y, "#ffd54f", 14);
    }
  }

  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)) e.preventDefault();
    if (k === "arrowup" || k === "w") actJump();
    else if (k === "arrowdown" || k === "s") actDive();
    else if (k === "arrowleft" || k === "a") actLeft();
    else if (k === "arrowright" || k === "d") actRight();
    else if (k === "f") actBoost();
    else if (k === " " || k === "enter") {
      if (S.mode !== "play") reset();
    } else if (k === "escape" && S.mode === "play") { S.mode = "menu"; }
  });
  window.addEventListener("keyup", (e) => {
    const k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") S.jumpHeld = false;
    if (k === "arrowdown" || k === "s") S.diveHeld = false;
    if (k === "arrowleft" || k === "a" || k === "arrowright" || k === "d") S.vx = 0;
  });

  const bind = (id, fn) => {
    const el = document.getElementById(id);
    if (!el) return;
    const fire = (e) => { e.preventDefault(); fn(); };
    el.addEventListener("pointerdown", fire);
  };
  bind("btn-up", actJump);
  bind("btn-down", actDive);
  bind("btn-left", actLeft);
  bind("btn-right", actRight);
  bind("btn-boost", actBoost);

  // 双击画布 = 加速
  let lastTap = 0;
  canvas.addEventListener("pointerdown", (e) => {
    if (S.mode !== "play") { reset(); return; }
    const now = performance.now();
    if (now - lastTap < 260) actBoost();
    lastTap = now;
  });

  // ============ 生成 ============
  function weightedPick() {
    const d = Math.min(1, S.time / 120);          // 难度 0..1
    const w = {
      rock: OBS.rock.wgt,
      kelp: OBS.kelp.wgt + d * 12,
      island: OBS.island.wgt + d * 10,
      crate: OBS.crate.wgt,
      boat: OBS.boat.wgt + d * 8,
      buoy: OBS.buoy.wgt,
      ramp: OBS.ramp.wgt,
    };
    let total = 0; for (const k in w) total += w[k];
    let r = Math.random() * total;
    for (const k in w) { r -= w[k]; if (r <= 0) return k; }
    return "rock";
  }
  function spawnObstacle() {
    const type = weightedPick();
    const o = Object.assign({ type, x: W + 70, sway: Math.random() * 6.28 }, OBS[type]);
    S.obstacles.push(o);
  }
  function spawnPickup() {
    const r = Math.random();
    let type = r < 0.5 ? "coin" : r < 0.8 ? "boost" : "life";
    const y = WAVE_Y - 60 - Math.random() * 60;
    S.pickups.push({ type, x: W + 40, y, r: 17 });
  }

  // ============ 粒子 ============
  function burst(x, y, color, n, spd = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = spd * (0.3 + Math.random());
      S.fx.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 50, life: .4 + Math.random() * .4, color, r: 2 + Math.random() * 3 });
    }
  }
  function splash(x, y, n) {
    for (let i = 0; i < n; i++) {
      S.fx.push({ x, y, vx: (Math.random() - .5) * 200, vy: -Math.random() * 240 - 60, life: .5 + Math.random() * .4, color: "#eafaff", r: 1.5 + Math.random() * 2.5 });
    }
  }

  // ============ 更新 ============
  function update(dt) {
    S.t += dt;
    if (S.mode === "menu" || S.mode === "over") return;

    S.time += dt;
    S.hint = Math.max(0, S.hint - dt);

    // 前进速度递增 + 减速/加速
    const slowMul = S.slow > 0 ? 0.55 : 1;
    const boostMul = S.boosting > 0 ? 1.55 : 1;
    const airMul = S.air > 0 ? 1.25 : 1;
    const target = S.fwdMin + (S.fwdMax - S.fwdMin) * Math.min(1, S.time / 90);
    S.fwd += (target - S.fwd) * Math.min(1, dt * 1.2);
    const speed = S.fwd * slowMul * boostMul * airMul;
    S.boosting = Math.max(0, S.boosting - dt);
    S.slow = Math.max(0, S.slow - dt);
    S.shield = Math.max(0, S.shield - dt);
    S.krakenWarn = Math.max(0, S.krakenWarn - dt);

    // 分数 = 前进距离（米）
    S.dist += speed * dt / 12;
    S.score = Math.floor(S.dist);
    if (S.score > S.best) S.best = S.score;

    // ---- 冲浪者垂直物理 ----
    if (S.air > 0) {
      // 腾空：重力回落
      S.air -= dt;
      S.vy += 2000 * dt;
      S.y += S.vy * dt;
      if (S.y >= WAVE_Y) { S.y = WAVE_Y; S.vy = 0; S.air = 0; S.shield = Math.max(S.shield, 0.4); splash(S.x, WAVE_Y, 14); }
    } else {
      if (S.jumpHeld && S.y > MAX_UP) S.vy -= 3000 * dt;
      if (S.diveHeld && S.y < MAX_DOWN) S.vy += 3000 * dt;
      if (S.y < WAVE_Y) S.vy += 1900 * dt;              // 空中下落
      else S.vy -= 1500 * dt * Math.min(1, (S.y - WAVE_Y) / 40); // 浮力拉回浪面
      S.vy = Math.max(-900, Math.min(900, S.vy));
      S.y += S.vy * dt;
      if (S.y > WAVE_Y + 6 && Math.abs(S.vy) > 260) splash(S.x, WAVE_Y, 2);
    }
    S.y = Math.max(MAX_UP, Math.min(MAX_DOWN, S.y));

    // ---- 水平移动 ----
    S.x += S.vx * dt;
    S.x = Math.max(MIN_X, Math.min(MAX_X, S.x));

    // ---- 生成 ----
    const gap = Math.max(0.62, 1.25 - S.time * 0.004);
    S.spawnT -= dt;
    if (S.spawnT <= 0) { S.spawnT = gap * (0.7 + Math.random() * 0.6); spawnObstacle(); }

    S.pickupT -= dt;
    if (S.pickupT <= 0) { S.pickupT = 2.2 + Math.random() * 2.0; spawnPickup(); }

    // 朋友：约 420 米处出现一次
    if (!S.friendSpawned && S.score > 420) {
      S.friendSpawned = true;
      S.pickups.push({ type: "friend", x: W + 60, y: WAVE_Y - 46, r: 20 });
    }

    // 海怪：随机预警后触手攻击
    if (S.kraken === 0 && S.time > 25 && Math.random() < dt * 0.12) {
      S.krakenWarn = 1.1;
    }
    if (S.krakenWarn > 0 && S.krakenWarn < 0.5 && S.kraken === 0 && S.tentacles.length === 0) {
      S.kraken = 2.6; S.krakenWarn = 0; sfx.kraken();
      for (let i = 0; i < 3; i++) S.tentacles.push({ x: S.x + (i - 1) * 120, phase: i * 2.1 });
    }

    // ---- 障碍移动 & 碰撞 ----
    for (let i = S.obstacles.length - 1; i >= 0; i--) {
      const o = S.obstacles[i];
      o.x -= speed * dt;
      if (o.x < -140) { S.obstacles.splice(i, 1); continue; }
      if (S.shield > 0 || S.air > 0) continue;      // 无敌/腾空不判定
      if (o.type === "ramp") {
        if (hit(o)) { S.obstacles.splice(i, 1); S.air = 1.45; S.vy = -820; sfx.ramp(); splash(S.x, WAVE_Y, 16); }
        continue;
      }
      if (hit(o)) {
        if (o.type === "buoy") { S.slow = 1.4; S.obstacles.splice(i, 1); splash(o.x + 19, WAVE_Y, 8); continue; }
        S.obstacles.splice(i, 1);
        crash();
      }
    }

    // ---- 拾取物 ----
    for (let i = S.pickups.length - 1; i >= 0; i--) {
      const p = S.pickups[i];
      p.x -= speed * dt;
      if (p.x < -40) { S.pickups.splice(i, 1); continue; }
      const dx = S.x - p.x, dy = S.y - p.y;
      if (dx * dx + dy * dy < (40 + p.r) * (40 + p.r)) {
        S.pickups.splice(i, 1);
        collect(p.type, p.x, p.y);
      }
    }

    // ---- 海怪触手 ----
    if (S.kraken > 0) {
      S.kraken -= dt;
      const cx = S.x;
      for (const tk of S.tentacles) {
        tk.x += (cx + (tk.phase - 3.14) * 70 - tk.x) * Math.min(1, dt * 3);
        if (rect(S.x - 20, S.y - 16, 40, 32, tk.x - 26, WAVE_Y - 30, 52, 200)) {
          gameOver("kraken");
          return;
        }
      }
      if (S.kraken <= 0) S.tentacles = [];
    }

    // ---- 粒子 ----
    for (let i = S.fx.length - 1; i >= 0; i--) {
      const f = S.fx[i];
      f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 500 * dt; f.life -= dt;
      if (f.life <= 0) S.fx.splice(i, 1);
    }
    if (S.shake > 0) S.shake -= dt * 20;

    // 泡沫尾迹
    if (Math.random() < dt * 30) splash(S.x - 24, WAVE_Y + 8, 1);
  }

  function hit(o) {
    return rect(S.x - 20, S.y - 16, 40, 32, o.x - o.w / 2 + 5, o.y + 5, o.w - 10, o.h - 10);
  }
  function rect(ax, ay, aw, ah, bx, by, bw, bh) {
    return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
  }

  function crash() {
    if (S.shield > 0 || S.air > 0) return;
    if (S.friend) {
      S.friend = false;
      burst(S.x, S.y, "#ffd54f", 16);
      S.shield = 1.4;
      sfx.pickup();
      return;
    }
    S.lives--;
    S.shield = 1.3;
    S.shake = 12;
    sfx.crash();
    burst(S.x, S.y, "#ff8a80", 16);
    if (S.lives <= 0) gameOver("lives");
  }

  function collect(type, x, y) {
    sfx.pickup();
    if (type === "coin") { S.dist += 25; S.score = Math.floor(S.dist); burst(x, y, "#ffe082", 10); }
    else if (type === "boost") { S.boosts = Math.min(S.boostMax, S.boosts + 1); burst(x, y, "#ffd54f", 12); }
    else if (type === "life") { S.lives = Math.min(3, S.lives + 1); burst(x, y, "#ff8a80", 14); }
    else if (type === "friend") { S.friend = true; burst(x, y, "#fff176", 18); }
  }

  function gameOver(cause) {
    S.mode = "over"; S.over = cause;
    if (S.score > S.best) { S.best = S.score; localStorage.setItem("surf2-best", String(S.best)); }
  }

  // ============ 绘制 ============
  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - .5) * S.shake, (Math.random() - .5) * S.shake);

    drawSky();
    drawWater();
    drawEntities();
    drawWave();
    drawSurfer();
    drawFx();
    drawHUD();

    ctx.restore();

    if (S.mode === "menu") drawMenu();
    else if (S.mode === "over") drawOver();
    else if (S.krakenWarn > 0) drawKrakenWarn();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#3fb6f0");
    g.addColorStop(0.5, "#8fd8f7");
    g.addColorStop(0.72, "#ffe9b8");
    g.addColorStop(1, "#ffd9a0");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    const sx = 790, sy = 110;
    const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 130);
    glow.addColorStop(0, "rgba(255,246,190,.95)");
    glow.addColorStop(0.4, "rgba(255,220,120,.5)");
    glow.addColorStop(1, "rgba(255,220,120,0)");
    ctx.fillStyle = glow; ctx.fillRect(sx - 140, sy - 140, 280, 280);
    ctx.fillStyle = "#fff6cf"; ctx.beginPath(); ctx.arc(sx, sy, 40, 0, 7); ctx.fill();

    drawCloud(120 + Math.sin(S.t * .06) * 22, 78, 1);
    drawCloud(430 + Math.sin(S.t * .05 + 2) * 28, 126, .8);
    drawCloud(700 + Math.sin(S.t * .04 + 4) * 32, 56, .9);
    ctx.fillStyle = "rgba(120,190,150,.5)";
    ctx.beginPath(); ctx.ellipse(520, 300, 90, 12, 0, 0, 7); ctx.fill();
  }
  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.beginPath();
    ctx.arc(x, y, 20 * s, 0, 7);
    ctx.arc(x + 22 * s, y - 8 * s, 24 * s, 0, 7);
    ctx.arc(x + 46 * s, y, 18 * s, 0, 7);
    ctx.arc(x + 22 * s, y + 6 * s, 20 * s, 0, 7);
    ctx.fill();
  }

  function waveFn(x) {
    return WAVE_Y + Math.sin(x * .014 + S.t * 2.2) * 8 + Math.sin(x * .031 + S.t * 1.5) * 4.5;
  }

  function drawWater() {
    const g = ctx.createLinearGradient(0, WAVE_Y - 30, 0, H);
    g.addColorStop(0, "#2fb0d8");
    g.addColorStop(0.45, "#1a86bd");
    g.addColorStop(1, "#0c5e93");
    ctx.fillStyle = g;
    ctx.fillRect(0, WAVE_Y - 30, W, H - WAVE_Y + 30);

    ctx.fillStyle = "rgba(255,255,255,.06)";
    for (let i = 0; i < 6; i++) {
      const x = ((i * 173 + S.t * 46) % (W + 220)) - 110;
      const y = WAVE_Y + 40 + (i * 53) % 160;
      ctx.beginPath(); ctx.ellipse(x, y, 44, 8, 0, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.18)";
    for (let i = 0; i < 8; i++) {
      const x = ((i * 137 + S.t * 30) % W);
      const y = H - ((S.t * (30 + i * 6) + i * 70) % (H - WAVE_Y));
      ctx.beginPath(); ctx.arc(x, y, 2 + (i % 3), 0, 7); ctx.fill();
    }
  }

  function drawWave() {
    ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.strokeStyle = "#eafaff";
    ctx.beginPath(); ctx.moveTo(-12, waveFn(-12));
    for (let x = -12; x <= W + 12; x += 6) ctx.lineTo(x, waveFn(x));
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-12, waveFn(-12) + 10);
    for (let x = -12; x <= W + 12; x += 8) ctx.lineTo(x, waveFn(x) + 10);
    ctx.stroke();
  }

  function drawEntities() {
    for (const p of S.pickups) drawPickup(p);
    for (const o of S.obstacles) drawObstacle(o);
    for (const tk of S.tentacles) drawTentacle(tk);
  }

  function drawObstacle(o) {
    const x = o.x, y = o.y;
    ctx.save(); ctx.translate(x, y);
    switch (o.type) {
      case "rock": {
        ctx.fillStyle = "#8d9aa5";
        ctx.beginPath();
        ctx.moveTo(-o.w / 2, 26); ctx.lineTo(-30, -16); ctx.lineTo(-8, -26);
        ctx.lineTo(16, -18); ctx.lineTo(o.w / 2, 20); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#aab6bf";
        ctx.beginPath(); ctx.moveTo(-30, -16); ctx.lineTo(-8, -26); ctx.lineTo(16, -18);
        ctx.lineTo(-2, -6); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#5d6b75";
        ctx.beginPath(); ctx.ellipse(-6, 4, 8, 5, 0, 0, 7); ctx.fill();
        break;
      }
      case "kelp": {
        const sway = Math.sin(S.t * 3 + o.sway) * 10;
        ctx.strokeStyle = "#2e8b57"; ctx.lineWidth = 9; ctx.lineCap = "round";
        for (let k = -1; k <= 1; k++) {
          ctx.beginPath(); ctx.moveTo(k * 16, 70);
          ctx.quadraticCurveTo(k * 22 + sway, 0, k * 8 + sway * 1.4, -70);
          ctx.stroke();
        }
        ctx.fillStyle = "#3cb371";
        ctx.beginPath(); ctx.ellipse(sway, -70, 12, 7, 0, 0, 7); ctx.fill();
        break;
      }
      case "island": {
        ctx.fillStyle = "#e8d29a";
        ctx.beginPath(); ctx.ellipse(0, 40, 44, 16, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = "#8d6e63"; ctx.lineWidth = 8; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(0, 40); ctx.quadraticCurveTo(8, -4, -3, -38); ctx.stroke();
        ctx.fillStyle = "#43a047";
        for (let i = 0; i < 5; i++) {
          const a = -Math.PI / 2 + (i - 2) * 0.5;
          ctx.save(); ctx.translate(-3, -38); ctx.rotate(a);
          ctx.beginPath(); ctx.ellipse(0, -16, 8, 19, 0, 0, 7); ctx.fill(); ctx.restore();
        }
        break;
      }
      case "crate": {
        ctx.fillStyle = "#b07a3e";
        ctx.fillRect(-o.w / 2, -16, o.w, o.h - 2);
        ctx.strokeStyle = "#7d5326"; ctx.lineWidth = 4;
        ctx.strokeRect(-o.w / 2, -16, o.w, o.h - 2);
        ctx.beginPath(); ctx.moveTo(-o.w / 2, -16); ctx.lineTo(o.w / 2, o.h - 18);
        ctx.moveTo(o.w / 2, -16); ctx.lineTo(-o.w / 2, o.h - 18); ctx.stroke();
        break;
      }
      case "boat": {
        ctx.fillStyle = "#e6f2f7";
        ctx.beginPath();
        ctx.moveTo(-o.w / 2, 8); ctx.quadraticCurveTo(0, o.h - 12, o.w / 2, 8); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#c0392b";
        ctx.fillRect(-o.w / 2 + 12, -30, o.w - 24, 40);
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.moveTo(-o.w / 2 + 14, -30); ctx.lineTo(0, -6); ctx.lineTo(o.w / 2 - 14, -30); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#8b4513";
        ctx.fillRect(-4, -38, 8, 34);
        break;
      }
      case "buoy": {
        ctx.fillStyle = "#ef5350";
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath(); ctx.arc(-4, -5, 5, 0, 7); ctx.fill();
        ctx.strokeStyle = "#37474f"; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 17, 0, 7); ctx.stroke();
        break;
      }
      case "ramp": {
        ctx.fillStyle = "#26c6da";
        ctx.beginPath();
        ctx.moveTo(-o.w / 2, 14); ctx.lineTo(o.w / 2, -14); ctx.lineTo(o.w / 2, 14); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#b2ebf2";
        ctx.beginPath();
        ctx.moveTo(-o.w / 2, 14); ctx.lineTo(o.w / 2, -14); ctx.lineTo(-o.w / 2 + 26, 14); ctx.closePath(); ctx.fill();
        break;
      }
    }
    ctx.restore();
  }

  function drawPickup(p) {
    ctx.save(); ctx.translate(p.x, p.y);
    const pulse = 1 + Math.sin(S.t * 6) * 0.08; ctx.scale(pulse, pulse);
    if (p.type === "coin") {
      ctx.fillStyle = "#ffd54f"; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
      ctx.strokeStyle = "#e6a817"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.stroke();
      ctx.fillStyle = "#fff3b0"; ctx.beginPath(); ctx.arc(-4, -4, 4, 0, 7); ctx.fill();
    } else if (p.type === "boost") {
      ctx.fillStyle = "#ffca28"; ctx.beginPath();
      ctx.moveTo(4, -16); ctx.lineTo(-8, 2); ctx.lineTo(0, 2); ctx.lineTo(-4, 16); ctx.lineTo(8, -2); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();
    } else if (p.type === "life") {
      ctx.fillStyle = "#ef5350";
      ctx.beginPath(); ctx.moveTo(0, 12); ctx.bezierCurveTo(-16, -2, -8, -14, 0, -6); ctx.bezierCurveTo(8, -14, 16, -2, 0, 12); ctx.fill();
    } else if (p.type === "friend") {
      ctx.fillStyle = "#f5deb3"; ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill();
      ctx.fillStyle = "#7b5b3a"; ctx.beginPath(); ctx.arc(-6, -6, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -6, 4, 0, 7); ctx.fill();
      ctx.fillStyle = "#333"; ctx.beginPath(); ctx.arc(0, 2, 3, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawTentacle(tk) {
    ctx.save(); ctx.translate(tk.x, WAVE_Y + 90);
    const sway = Math.sin(S.t * 5 + tk.phase) * 18;
    ctx.strokeStyle = "#7e57c2"; ctx.lineWidth = 15; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, H - (WAVE_Y + 90));
    ctx.quadraticCurveTo(sway, -40, sway * 1.6, -130);
    ctx.stroke();
    ctx.fillStyle = "#b39ddb";
    ctx.beginPath(); ctx.arc(sway * 1.6, -130, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#9575cd";
    for (let i = 1; i <= 3; i++) {
      ctx.beginPath(); ctx.arc(sway * 0.5 * i / 3, -130 * i / 4, 4, 0, 7); ctx.fill();
    }
    ctx.restore();
  }

  function drawSurfer() {
    const x = S.x, y = S.y + Math.sin(S.t * 3.4) * 3;
    const under = S.y > WAVE_Y + 6;
    const inAir = S.y < WAVE_Y - 8;
    const angle = Math.max(-0.5, Math.min(0.5, S.vy / 1400));
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle * (under ? 0.7 : 1));

    ctx.save();
    ctx.rotate(-0.08);
    ctx.fillStyle = "#ff7043";
    roundRect(-34, -2, 68, 13, 6); ctx.fill();
    ctx.fillStyle = "#ffb74d";
    roundRect(-27, 0, 54, 4, 2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = "#ffcc80";
    ctx.fillRect(-10, -20, 8, 18);
    ctx.fillRect(4, -20, 8, 18);
    ctx.fillStyle = "#26a69a";
    ctx.beginPath(); roundRect(-9, -38, 20, 20, 6); ctx.fill();
    ctx.fillStyle = "#ffcc80";
    ctx.beginPath(); ctx.arc(1, -48, 9, 0, 7); ctx.fill();
    ctx.fillStyle = "#5d4037";
    ctx.beginPath(); ctx.arc(1, -50, 9, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
    ctx.strokeStyle = "#ffcc80"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-9, -34); ctx.lineTo(-20, -20);
    ctx.moveTo(11, -34); ctx.lineTo(22, -18);
    ctx.stroke();

    ctx.restore();

    if (under) {
      ctx.fillStyle = "rgba(18,90,140,.34)";
      ctx.fillRect(x - 40, y - 10, 80, 30);
    }
    if (inAir) {
      ctx.fillStyle = "rgba(20,60,90,.25)";
      ctx.beginPath(); ctx.ellipse(x, WAVE_Y + 8, 26 - (WAVE_Y - S.y) * 0.02, 5, 0, 0, 7); ctx.fill();
    }
  }

  function drawFx() {
    for (const f of S.fx) {
      ctx.globalAlpha = Math.max(0, f.life / 0.5);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    ctx.textBaseline = "top"; ctx.textAlign = "left";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 30px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText(String(S.score).padStart(5, "0"), 18, 14);
    ctx.font = "12px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("得分 (米)", 18, 46);
    ctx.textAlign = "right";
    ctx.font = "bold 18px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("最佳 " + String(S.best).padStart(5, "0"), W - 18, 18);
    ctx.textAlign = "left";
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < S.lives ? "#ef5350" : "rgba(255,255,255,.25)";
      ctx.beginPath();
      const hx = 18 + i * 26, hy = 66;
      ctx.moveTo(hx, hy + 10); ctx.bezierCurveTo(hx - 12, hy, hx - 6, hy - 8, hx, hy - 2);
      ctx.bezierCurveTo(hx + 6, hy - 8, hx + 12, hy, hx, hy + 10); ctx.fill();
    }
    for (let i = 0; i < S.boostMax; i++) {
      ctx.fillStyle = i < S.boosts ? "#ffca28" : "rgba(255,255,255,.22)";
      ctx.beginPath();
      const bx = 18 + i * 26, by = 88;
      ctx.moveTo(bx + 4, by - 12); ctx.lineTo(bx - 6, by + 2); ctx.lineTo(bx, by + 2); ctx.lineTo(bx - 4, by + 12); ctx.lineTo(bx + 6, by - 2); ctx.lineTo(bx, by - 2); ctx.closePath(); ctx.fill();
    }
    if (S.friend) {
      ctx.fillStyle = "#fff176";
      ctx.font = "bold 14px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("🐕 伙伴", 18, 122);
    }
    const sp = Math.round(S.fwd / S.fwdMax * 100);
    ctx.fillStyle = "rgba(255,255,255,.25)";
    ctx.fillRect(18, H - 26, 150, 8);
    ctx.fillStyle = S.boosting > 0 ? "#ffca28" : "#7cf0ff";
    ctx.fillRect(18, H - 26, 150 * sp / 100, 8);
    ctx.fillStyle = "rgba(255,255,255,.85)";
    ctx.font = "12px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("速度 " + sp + "%", 18, H - 44);

    if (S.hint > 0 && S.mode === "play") {
      ctx.globalAlpha = Math.min(1, S.hint);
      ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,255,255,.95)";
      ctx.font = "bold 17px 'Segoe UI', system-ui, sans-serif";
      ctx.fillText("↑ 跳跃  ·  ↓ 下潜  ·  ←→ 移动  ·  F 加速", W / 2, 78);
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = "left";
  }

  function drawMenu() {
    overlay("rgba(8, 28, 52, .42)");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff";
    ctx.font = "900 86px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("SURF", W / 2, 150);
    ctx.font = "24px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#ffe082";
    ctx.fillText("冲浪小游戏", W / 2, 208);
    ctx.font = "17px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("↑ / ↓ 上浮·下潜     ← / → 左右移动    F 加速", W / 2, 300);
    ctx.fillText("避开岩石、海草、木箱与船只，收集金币与能量", W / 2, 328);
    ctx.fillText("小心海怪的触手！", W / 2, 356);
    const pulse = 0.85 + Math.sin(S.t * 4) * 0.15;
    ctx.font = "bold 26px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255," + pulse.toFixed(2) + ")";
    ctx.fillText("点击 或 按空格 开始", W / 2, 430);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawOver() {
    overlay("rgba(8, 20, 40, .6)");
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (S.over === "kraken") {
      ctx.font = "900 58px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "#b39ddb";
      ctx.fillText("被海怪抓住了！", W / 2, 165);
    } else {
      ctx.font = "900 64px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "#ff8a80";
      ctx.fillText("游戏结束", W / 2, 170);
    }
    ctx.font = "30px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#fff";
    ctx.fillText("得分  " + String(S.score).padStart(5, "0"), W / 2, 245);
    ctx.font = "20px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "#ffe082";
    const nb = S.score >= S.best && S.score > 0;
    ctx.fillText(nb ? "🎉 新纪录！" : "最佳  " + String(S.best).padStart(5, "0"), W / 2, 295);
    ctx.font = "18px 'Segoe UI', system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ctx.fillText("按 空格 或 点击屏幕 再来一局", W / 2, 375);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawKrakenWarn() {
    const a = (Math.sin(S.t * 20) * 0.5 + 0.5) * 0.7 + 0.3;
    ctx.fillStyle = "rgba(255,30,40," + (a * 0.25).toFixed(2) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#fff"; ctx.font = "900 30px 'Segoe UI', system-ui, sans-serif";
    ctx.fillText("⚠ 危险 ⚠", W / 2, 120);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function overlay(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ============ 主循环 ============
  let last = performance.now();
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.1) dt = 0.1;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
